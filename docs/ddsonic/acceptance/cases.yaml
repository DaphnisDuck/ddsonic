# ddsonic acceptance case catalog.
#
# One entry per case: what is checked, against which promise (semantics), and
# where its procedure lives. No steps are written here. A scripted case names
# a Go test (runner: "<package dir>:<TestName>"); a manual case names a
# heading in a runbook beside this file (procedure: "<doc>#<anchor>").
#
# `make acceptance-validate` checks this file; ../acceptance.md explains the
# fields, the lanes and the gate. Changing a case, its runner or a semantics
# row changes the basis of the evidence: it is reviewed like any other change.

semantics:
  - id: general/artifact
    kind: general
    statement: Acceptance tests the binary extracted from the release archive, identified by checksum and by the version it reports.
  - id: general/startup
    kind: general
    statement: ddsonic starts without setup, shows the library, and quits cleanly, leaving no socket behind.
  - id: general/configuration
    kind: general
    statement: >-
      A start that cannot be honoured is refused with a message that names what is wrong, before anything starts.
      A config.toml that is not valid TOML is such a start: it never falls back to the defaults, and the file is left as it is.
      No config file, and a valid one, start normally.
  - id: general/playback
    kind: general
    statement: A track plays, the queue grows and playback stops as asked, and the remote state says so.
  - id: general/sync
    kind: general
    statement: >-
      A synced list changes only on a sync. The cached library is shown after a restart before the source is read again.
      A failed sync keeps that collection's cache and shows the failure; the next successful sync needs no restart.
      A cancelled sync commits nothing incomplete or stale.
  - id: general/presentation
    kind: general
    statement: Text stays inside the screen. A level's note wraps to the panel and gives way to the list on a short terminal.
  - id: local/library
    provider: Local
    list: Albums, Artists, Genres
    kind: authoritative
    statement: Authoritative for the tagged files under the music folder. A file added or removed shows after a refresh.
  - id: spotify/liked-songs
    provider: Spotify
    list: Liked Songs
    kind: authoritative
    statement: The account's saved tracks.
  - id: spotify/albums
    provider: Spotify
    list: Albums
    kind: authoritative
    statement: The account's saved albums.
  - id: spotify/artists
    provider: Spotify
    list: Artists
    kind: authoritative
    statement: The artists the account follows.
  - id: spotify/playlists
    provider: Spotify
    list: Playlists
    kind: authoritative
    statement: The playlists the account owns or follows.
  - id: search/unified
    list: Search
    kind: local
    statement: Ordinary search reads the cached catalog of every source. It is not the provider's live search.
  - id: search/provider-live
    list: Search <provider> for …
    kind: live
    statement: An explicit provider search asks that provider's service, and the screen names the provider and the query while loading and after.
  - id: ytmusic/liked-music
    provider: YouTube Music
    list: Liked Music
    kind: authoritative
    statement: The account's liked tracks, as synced.
  - id: ytmusic/playlists
    provider: YouTube Music
    list: Playlists
    kind: authoritative
    statement: The playlists in the account's current feed, plus those named in the config. Not claimed to be every playlist the account follows.
  - id: ytmusic/albums-from-tracks
    provider: YouTube Music
    list: Albums from tracks
    kind: derived
    statement: >-
      Derived from synced tracks, and incomplete. Saving an album that no synced track represents does not, by that alone, make it appear.
      An album a synced track represents may appear whether it is saved or not.
  - id: ytmusic/artists-from-tracks
    provider: YouTube Music
    list: Artists from tracks
    kind: derived
    statement: >-
      Derived from synced tracks, and incomplete. Following an artist that no synced track credits does not, by that alone, make it appear.
      An artist a synced track credits may appear whether it is followed or not.
  - id: radio/favorites
    provider: Radio
    list: Favorites
    kind: authoritative
    statement: The stations starred on this machine.
  - id: radio/browse
    provider: Radio
    list: Browse Stations
    kind: live
    statement: The live station directory. It needs the network and is not synced.

